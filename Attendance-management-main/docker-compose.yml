version: '3.8'

services:
  db:
    image: mysql:8
    container_name: ams-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ams_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ams-backend
    environment:
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=ams_db
      - JWT_ACCESS_SECRET=super-secret-access-change-in-prod
      - JWT_REFRESH_SECRET=super-secret-refresh-change-in-prod
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ams-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: